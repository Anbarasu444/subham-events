name: vendor_app
description: "Subam Vendor — vendor app of the Event Planning Platform."
publish_to: 'none'

version: 1.0.0+1

environment:
  # Matches the installed Flutter/Dart (same as user_app, GI-8).
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.3
  dio: ^5.11.1
  encrypted_shared_preferences: ^3.0.1
  flutter_cache_manager: ^3.4.5
  cached_network_image: ^4.0.3
  flutter_native_splash: ^2.4.8
  package_info_plus: ^10.2.2
  freerasp: ^8.2.4
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/illustrations/

  # Kalam (SIL OFL 1.1), same festive font as the User App.
  fonts:
    - family: Kalam
      fonts:
        - asset: assets/fonts/kalam/Kalam-Light.ttf
          weight: 300
        - asset: assets/fonts/kalam/Kalam-Regular.ttf
          weight: 400
        - asset: assets/fonts/kalam/Kalam-Bold.ttf
          weight: 700

# Regenerate after changes: dart run flutter_native_splash:create
flutter_native_splash:
  # Vendor deep teal (AppColors.tealDeep in app_style.dart).
  color: "#0B6E66"
  color_dark: "#0F2A24"
  android_12:
    color: "#0B6E66"
    color_dark: "#0F2A24"
  web: false
